name: Ticket Scraper

on:
  workflow_dispatch: # GitHubの画面から手動でボタンを押して実行できるよう、または外部API（cron-job.orgなど）からキックできるようにする設定

permissions:
  contents: write # 実行後にデータをGitHubに保存（プッシュ）するために必要

# 排他制御: 同じワークフローが同時に2つ以上走ることを防止
# cancel-in-progress: false → 先行ジョブを尊重し、後発はキューで待機
concurrency:
  group: ticket-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # API取得・詳細取得が各最大40分 + セットアップ・保存の余裕

    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 今回と日付跨ぎ用の変更履歴日付
        id: dates
        run: |
          echo "today=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "tomorrow=$(date -u --date=tomorrow +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_TICKET_CACHE_PATH=$RUNNER_TEMP/public-ticket-${{ github.run_id }}-${{ github.run_attempt }}.json" >> "$GITHUB_ENV"

      - name: リポジトリのチェックアウト
        uses: actions/checkout@v7
        with:
          ref: main # 待機後も最新の蓄積とコードから開始する
          fetch-depth: 1
          # Keep old blobs in Git; fetch only current state and append logs.
          # Sparse checkout automatically selects the blob:none fetch filter.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /tests/
            /tools/
            /data/targets.json
            /data/*_master.csv
            /data/*_master.csv.gz
            /data/anonymous_sold_inventory.jsonl
            /data/observation_*.jsonl
            /data/content_observation_*.jsonl
            /data/ticket_changes_${{ steps.dates.outputs.today }}*.jsonl
            /data/ticket_changes_${{ steps.dates.outputs.tomorrow }}*.jsonl

      - name: Pythonのセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: '3.11' # Python 3.11 を使用
          
      - name: 依存関係パッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: 収集・履歴保持の回帰テスト
        run: python -m unittest discover -s tests -q

      - name: Git保存用gzipからmaster CSVを復元
        run: python repository_data_storage.py restore --data-dir data --masters-only

      - name: 既存の変更履歴を30 MiB以下へ分割（内容一致を検証）
        run: python ticket_change_log.py --data-dir data
        
      - name: 全対象のAPI状態を収集
        env:
          SCRAPE_MODE: api
        run: python scraper.py

      - name: 公開チケット全文を更新（取得済み含む）
        env:
          SCRAPE_MODE: details
        run: python scraper.py
        
      # Audit before packing; keep checkpoints even if quality is incomplete.
      - name: 全文・公開チケット情報の品質確認
        id: audit
        continue-on-error: true
        run: python tools/audit_public_content.py --data-dir data

      - name: 大きなCSVを内容一致検証付きgzipへ変換
        run: python repository_data_storage.py pack --data-dir data

      - name: 取得したデータを保存（コミット＆プッシュ）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --sparse data/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "自動更新: チケットデータのスクレイピング"
          git pull --rebase origin main
          git push

      - name: 品質確認結果を反映
        if: steps.audit.outcome == 'failure'
        run: exit 1
