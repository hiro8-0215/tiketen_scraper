name: Ticket Scraper

on:
  workflow_dispatch: # GitHubの画面から手動でボタンを押して実行できるよう、または外部API（cron-job.orgなど）からキックできるようにする設定

permissions:
  contents: write # 実行後にデータをGitHubに保存（プッシュ）するために必要

# 排他制御: 同じワークフローが同時に2つ以上走ることを防止
# cancel-in-progress: false → 先行ジョブを尊重し、後発はキューで待機
concurrency:
  group: ticket-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # ランナー割り当て遅延等の異常滞留に対する安全装置

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 全履歴を取得（コミットに必要）

      - name: Pythonのセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: '3.11' # Python 3.11 を使用
          
      - name: 依存関係パッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Playwright（ブラウザ）のインストール
        run: playwright install chromium
        
      - name: スクレイピングの実行
        run: python scraper.py
        
      - name: 取得したデータを保存（コミット＆プッシュ）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "自動更新: チケットデータのスクレイピング"
          git pull --rebase origin main
          git push
