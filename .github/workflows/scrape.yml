name: Ticket Scraper

on:
  workflow_dispatch: # 通常は外部スケジューラから実行
    inputs:
      recover_details:
        description: "個別状態と全文を同じ実行で回収し、残件があれば監査で失敗にする"
        type: boolean
        default: false

permissions:
  contents: write # 実行後にデータをGitHubに保存（プッシュ）するために必要

# 排他制御: 同じワークフローが同時に2つ以上走ることを防止
# cancel-in-progress: false → 先行ジョブを尊重し、後発はキューで待機
concurrency:
  group: ticket-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.recover_details && 360 || 60 }}

    env:
      PYTHONUNBUFFERED: "1"
      PUBLIC_API_MIN_INTERVAL: ${{ vars.PUBLIC_API_MIN_INTERVAL || '4.5' }}
      PUBLIC_API_SERVER_COOLDOWN_PATH: data/public_api_retry_at.txt
      PUBLIC_RECOVERY: ${{ inputs.recover_details }}
    steps:
      - name: 今回と日付跨ぎ用の変更履歴日付
        id: dates
        run: |
          echo "today=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "tomorrow=$(date -u --date=tomorrow +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "COLLECTION_AUDIT_SINCE=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_ENV"
          echo "PUBLIC_TICKET_CACHE_PATH=$RUNNER_TEMP/public-ticket-${{ github.run_id }}-${{ github.run_attempt }}.json" >> "$GITHUB_ENV"
          echo "PUBLIC_API_COOLDOWN_PATH=$RUNNER_TEMP/public-ticket-${{ github.run_id }}-${{ github.run_attempt }}.cooldown" >> "$GITHUB_ENV"
          if [[ "$PUBLIC_RECOVERY" == "true" ]]; then
            # Leave room for audit, packing, and push before the six-hour job limit.
            echo "PUBLIC_RUN_DEADLINE_EPOCH=$(date -u --date='+350 minutes' +%s)" >> "$GITHUB_ENV"
          else
            # Share the hourly budget across both passes and leave time to save.
            echo "PUBLIC_RUN_DEADLINE_EPOCH=$(date -u --date='+53 minutes' +%s)" >> "$GITHUB_ENV"
          fi

      - name: リポジトリのチェックアウト
        uses: actions/checkout@v7
        with:
          ref: main # 待機後も最新の蓄積とコードから開始する
          fetch-depth: 1
          # Keep old blobs in Git; fetch only current state and append logs.
          # Sparse checkout automatically selects the blob:none fetch filter.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /tests/
            /tools/
            /data/targets.json
            /data/public_api_retry_at.txt
            /data/*_master.csv
            /data/*_master.csv.gz
            /data/anonymous_sold_inventory.jsonl
            /data/observation_*.jsonl
            /data/content_observation_*.jsonl
            /data/ticket_changes_${{ steps.dates.outputs.today }}*.jsonl
            /data/ticket_changes_${{ steps.dates.outputs.tomorrow }}*.jsonl

      - name: Pythonのセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: '3.11' # Python 3.11 を使用
          cache: 'pip'
          
      - name: 依存関係パッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: 収集・履歴保持の回帰テスト
        run: python -m unittest discover -s tests -q

      - name: Git保存用gzipからmaster CSVを復元
        run: python repository_data_storage.py restore --data-dir data --masters-only

      - name: 既存の変更履歴を30 MiB以下へ分割（内容一致を検証）
        run: python ticket_change_log.py --data-dir data
        
      - name: 全対象のAPI状態を収集
        env:
          SCRAPE_MODE: api
          PUBLIC_STATUS_RUNTIME_MINUTES: ${{ inputs.recover_details && '265' || '30' }}
          PUBLIC_STATUS_CHECK_LIMIT: '6000'
          COLLECTION_COVERAGE_PATH: ${{ runner.temp }}/ticket-collection-coverage.json
        run: python scraper.py

      - name: 公開チケット全文を順次取得・再確認
        env:
          SCRAPE_MODE: details
          PUBLIC_DETAIL_RUNTIME_MINUTES: ${{ inputs.recover_details && '350' || '40' }}
          PUBLIC_CONTENT_CHECK_LIMIT: '6000'
        run: python scraper.py
        
      # Audit before packing; keep checkpoints even if quality is incomplete.
      - name: 全文・公開チケット情報の品質確認
        id: audit
        continue-on-error: true
        env:
          AUDIT_MODE: ${{ inputs.recover_details && '--rolling' || '--inventory-first' }}
        run: python tools/audit_public_content.py --data-dir data "$AUDIT_MODE"

      - name: 大きなCSVを内容一致検証付きgzipへ変換
        run: python repository_data_storage.py pack --data-dir data

      - name: 取得したデータを保存（コミット＆プッシュ）
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --sparse data/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "自動更新: チケットデータのスクレイピング"
          push_log="$RUNNER_TEMP/ticket-scraper-push.log"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push 2>&1 | tee "$push_log"; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]] || ! grep -Eiq 'fatal error in commit_refs_rules|requested URL returned error: (502|503|504)|connection (reset|timed out)' "$push_log"; then
              exit 1
            fi
            echo "Temporary git push failure; retrying in $((15 * attempt)) seconds"
            sleep "$((15 * attempt))"
          done

      - name: 公演取得漏れを報告（回収済みデータは保存済み）
        run: python tools/check_collection_coverage.py "$RUNNER_TEMP/ticket-collection-coverage.json"

      - name: 品質確認結果を反映
        if: always() && !cancelled() && steps.audit.outcome == 'failure'
        run: exit 1
