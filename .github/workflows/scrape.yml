name: Ticket Scraper

on:
  workflow_dispatch: # GitHubの画面から手動でボタンを押して実行できるよう、または外部API（cron-job.orgなど）からキックできるようにする設定

permissions:
  contents: write # 実行後にデータをGitHubに保存（プッシュ）するために必要

# 排他制御: 同じワークフローが同時に2つ以上走ることを防止
# cancel-in-progress: false → 先行ジョブを尊重し、後発はキューで待機
concurrency:
  group: ticket-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # API取得・詳細取得が各最大40分 + セットアップ・保存の余裕

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v7
        with:
          ref: main # 待機後も最新の蓄積とコードから開始する
          fetch-depth: 0 # 全履歴を取得（コミットに必要）

      - name: Pythonのセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: '3.11' # Python 3.11 を使用
          
      - name: 依存関係パッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Playwright（ブラウザ）のインストール
        run: playwright install chromium

      - name: 収集・履歴保持の回帰テスト
        run: python -m unittest discover -s tests -q

      - name: 既存の変更履歴を30 MiB以下へ分割（内容一致を検証）
        run: python ticket_change_log.py --data-dir data
        
      - name: 全対象のAPI状態を収集
        env:
          SCRAPE_MODE: api
        run: python scraper.py

      - name: 公開チケット全文を更新（取得済み含む）
        env:
          SCRAPE_MODE: details
        run: python scraper.py
        
      - name: 取得したデータを保存（コミット＆プッシュ）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "自動更新: チケットデータのスクレイピング"
          git pull --rebase origin main
          git push

      - name: 全文・公開チケット情報の品質確認
        run: python tools/audit_public_content.py --data-dir data
