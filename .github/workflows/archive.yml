name: Daily Archive to Google Drive

on:
  workflow_dispatch:
    inputs:
      log_date:
        description: "UTCの収集ログのみ保存する日付（YYYYMMDD）。空欄でマスターCSV"
        type: string
        default: ''
  workflow_call:
    inputs:
      data_ref:
        type: string
        required: true
    secrets:
      GDRIVE_WEBAPP_URL:
        required: true
      GDRIVE_UPLOAD_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # 送信・再試行40分 + チェックアウトと送信準備の余裕
    concurrency:
      group: google-drive-archive
      cancel-in-progress: false
    steps:
      - name: バックアップ先サブフォルダ名の算出
        id: target
        run: |
          subfolder=$(TZ=Asia/Tokyo date +'data_%-m_%-d')
          echo "subfolder=$subfolder" >> "$GITHUB_OUTPUT"

      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.data_ref }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            ${{ inputs.log_date && '/data/anonymous_sold_inventory.jsonl' || '/data/*_master.csv' }}
            ${{ !inputs.log_date && '/data/*_master.csv.gz' || '' }}

      - name: Pythonのセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 同日アップロード済みパートのキャッシュを復元
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/gdrive-upload-cache
          key: gdrive-upload-${{ steps.target.outputs.subfolder }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gdrive-upload-${{ steps.target.outputs.subfolder }}-

      - name: 明示的に有効な場合だけJSONLを取得
        env:
          GDRIVE_INCLUDE_JSONL: ${{ vars.GDRIVE_INCLUDE_JSONL }}
          GDRIVE_LOG_DATE: ${{ inputs.log_date }}
        run: |
          python - <<'PY'
          import os, subprocess
          from datetime import datetime
          day = os.environ.get('GDRIVE_LOG_DATE', '').strip()
          if day:
              if datetime.strptime(day, '%Y%m%d').strftime('%Y%m%d') != day:
                  raise ValueError('log_date must use UTC YYYYMMDD')
              subprocess.run(['git', 'sparse-checkout', 'add', '--no-cone',
                              f'/data/observation_{day}.jsonl',
                              f'/data/content_observation_{day}.jsonl',
                              f'/data/ticket_changes_{day}*.jsonl'], check=True)
          elif os.environ.get('GDRIVE_INCLUDE_JSONL', '').lower() in {'1', 'true', 'yes'}:
              subprocess.run(['git', 'sparse-checkout', 'add', '--no-cone', '/data/*.jsonl'], check=True)
          PY

      - name: Google Driveへデータをバックアップ
        env:
          GDRIVE_WEBAPP_URL: ${{ secrets.GDRIVE_WEBAPP_URL }}
          GDRIVE_UPLOAD_TOKEN: ${{ secrets.GDRIVE_UPLOAD_TOKEN }}
          GDRIVE_SOURCE_DIR: data
          GDRIVE_UPLOAD_CACHE_PATH: ${{ runner.temp }}/gdrive-upload-cache/upload_state.json
          GDRIVE_FORCE_FULL_UPLOAD: ${{ inputs.data_ref == '' }}
          GDRIVE_LOG_DATE: ${{ inputs.log_date }}
          # Enable only after redeploying Code.gs with numbered JSONL part support.
          GDRIVE_INCLUDE_JSONL: ${{ vars.GDRIVE_INCLUDE_JSONL }}
        run: python upload_to_gdrive.py

      - name: 同日アップロード済みパートのキャッシュを保存
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/gdrive-upload-cache
          key: gdrive-upload-${{ steps.target.outputs.subfolder }}-${{ github.run_id }}-${{ github.run_attempt }}
